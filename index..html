<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loja do paulos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">

        <section>
            <nav class="navbar">

                <a href="#">home</a>

            </nav>

            <a href="#" class="logo">

                <img width="70" height="70" src="img/logo.png" alt="logo">

            </a>

           <!--div class = ixons

            </div>!-->

        </section>

    </header>
    <div class="home-container">

        <section id="#home">
            
            <div class="content">

                <h3>importados mais baratos do mercado</h3>
                <p>compras feitas direto com o fornecedor pelo whatsapp</p>

            </div>

        </section>

    </div>



    <section class="catalogo">
        <div class="catalogo-header">
            <h1>CATÁLOGO</h1>
            <p>Encontre seu produto aqui</p>
        </div>

        <div class="filtros">
            <input
                type="text"
                id="pesquisa"
                placeholder="Pesquisar produto..."
            >

            <select id="categoria">
                <option value="todas">Todas as categorias</option>
                <option value="selecoes">Seleções</option>
                <option value="clubes">Clubes</option>
                <option value="tenis">Tênis</option>
                <option value="bolsas">Bolsas</option>
            </select>
        </div>

        <div class="produtos" id="produtos"></div>
    </section>

    <script src="js/products.js"></script>

</body>
</html>
